<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>Minichat — Windows 95</title>
        <link href="../../Additions/animate.css" rel="stylesheet" type="text/css">
        <link rel="stylesheet" href="../../Additions/base-style.css">
        <link href="fonts/fonts.css" rel="stylesheet" type="text/css">
        <link href="style.css" rel="stylesheet" type="text/css">
        <script src="../../Additions/vue.global.js"></script>
        <script src="../../Additions/widget.js"></script>
        <script src="template.js"></script>
    </head>

    <body>
        <div class="widget" id="widget">
            <div class="win-window" :style="TextStyle">
                <div class="win-titlebar" v-if="ShowTitleBar">
                    <span class="win-icon" aria-hidden="true"></span>
                    <span class="win-title">{{ TitleText }}</span>
                    <span class="win-buttons">
                        <span class="win-btn">_</span>
                        <span class="win-btn">□</span>
                        <span class="win-btn win-btn-close">×</span>
                    </span>
                </div>
                <div class="win-body">
                    <div class="live-events" v-if="ShowLive && LiveEvents.length">
                        <div class="live_event" v-for="event in LiveEvents" v-bind:key="event.GUID">{{ FormattedMessage(event) }}</div>
                    </div>
                    <transition-group tag="div" class="messages" :enter-active-class="'animate__animated animate__' + ShowEffect" :leave-active-class="'animate__animated animate__' + HideEffect">
                        <div class="display_message" v-for="message in ChatMessages" v-bind:key="message.GUID" :id="message.GUID">
                            <span v-if="ShowServiceIcons" class="service-icon"><img :src="'../../Images/' + message.Service + '.png'" /></span>
                            <span class="avatar" :class="{ 'no-avatar': NoAvatar(message) }">
                                <img :src="message.Avatar.Default" loading="lazy" onerror='this.style.display="none"' onload="this.style.opacity=1" />
                            </span>
                            <span class="badges" v-if="ShowBadges && message.badges && message.badges.length">
                                <img v-for="badge in message.badges" v-bind:key="badge" :src="badge.Image.Default" />
                            </span>
                            <span class="username" :style="UseColorUserName ? { color: message.Color == undefined ? ColorUserName : message.Color } : { color: ColorUserName }">{{ message.UserName }}:</span>
                            <span class="text-message" :class="{ 'reply': message.Reply && !message.isDeleted, 'highlighted': message.Meta && message.Meta.Highlighted && !message.isDeleted, 'deleted': message.isDeleted }, 'no-image-in-message'">{{ FormattedMessage(message) }}</span>
                        </div>
                    </transition-group>
                </div>
                <div class="win-tray" v-if="ShowTrayClock">
                    <span class="tray-clock">{{ Clock }}</span>
                </div>
            </div>
        </div>
    </body>

</html>
