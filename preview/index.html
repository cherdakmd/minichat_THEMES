<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minichat THEMES — превью</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --border: #2b3444;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4f8cff;
    --accent2: #b967ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  h1 {
    font-size: 17px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  h1 b { color: var(--accent); }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12.5px;
  }
  select, input[type=range] { accent-color: var(--accent); }
  select {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 6px;
  }
  button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 12.5px;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  nav {
    width: 240px;
    flex: 0 0 auto;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .theme-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13.5px;
  }
  .theme-btn img { width: 28px; height: 28px; border-radius: 6px; flex: 0 0 auto; }
  .theme-btn .t-name { flex: 1; }
  .theme-btn .t-desc { display: block; font-size: 10.5px; color: var(--muted); font-weight: 400; }
  .theme-btn.active { background: var(--accent); border-color: var(--accent); }
  .theme-btn.active .t-desc { color: rgba(255,255,255,.75); }
  .stage-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .stage {
    flex: 1;
    margin: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
    min-height: 0;
  }
  .stage iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  /* Фоны для проверки читаемости */
  .stage.dark { background: #0b0f14; }
  .stage.bright { background: #e9edf2; }
  .stage.checker {
    background:
      conic-gradient(#c9ccd1 0 25%, #f2f3f5 0 50%, #c9ccd1 0 75%, #f2f3f5 0) 0 0 / 24px 24px;
  }
  .stage.game {
    background:
      radial-gradient(circle at 76% 20%, #ffef9e 0 6.5%, rgba(255,239,158,0) 8%),
      radial-gradient(circle at 18% 12%, #ffffffcc 0 4%, rgba(255,255,255,0) 5%),
      radial-gradient(circle at 30% 15%, #ffffffb0 0 3%, rgba(255,255,255,0) 4.2%),
      linear-gradient(#5ab9ff 0 58%, #71c94e 58% 74%, #4c8a3a 74% 100%);
  }
  footer {
    padding: 7px 16px;
    color: var(--muted);
    font-size: 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  footer b { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>Minichat <b>THEMES</b> — превью тем</h1>
  <div class="toolbar">
    <label>Фон
      <select id="backdrop">
        <option value="dark">Тёмный</option>
        <option value="game">Игра (яркий)</option>
        <option value="bright">Светлый</option>
        <option value="checker">Прозрачность</option>
      </select>
    </label>
    <label>Скорость
      <input type="range" id="rate" min="0.25" max="3" step="0.25" value="1">
      <span id="rate-val">1×</span>
    </label>
    <button id="pause">⏸ Пауза</button>
    <button id="clear">🗑 Очистить</button>
    <button id="donate">💰 Донат</button>
    <button id="live">⚡ Событие</button>
  </div>
</header>

<main>
  <nav id="theme-list"></nav>
  <div class="stage-wrap">
    <div class="stage dark" id="stage">
      <iframe id="frame" title="Превью темы"></iframe>
    </div>
  </div>
</main>

<footer>
  Превью работает на заглушке <b>preview/stubs/Additions/widget.js</b>, которая имитирует сообщения чата.
  В реальном Minichat темы используют свой <b>Additions/widget.js</b>. Запуск превью: <b>python3 preview/serve.py</b>
</footer>

<script>
  var THEMES = [
    { id: 'Matrix',    name: 'Матрица',      desc: 'терминал, цифровой дождь' },
    { id: 'Arcade',    name: 'Аркада',        desc: 'пиксельная игра 80-х' },
    { id: 'Windows95', name: 'Windows 95',    desc: 'ретро-окно с треем' },
    { id: 'Neon',      name: 'Неон',          desc: 'стекло и свечение' },
    { id: 'Vaporwave', name: 'Вейпорвейв',    desc: 'сетка, солнце, градиенты' },
    { id: 'Comic',     name: 'Комикс',        desc: 'пузыри и обводка' },
    { id: 'Minecraft', name: 'Minecraft',     desc: 'строки как в игре' },
    { id: 'Dos',       name: 'DOS',           desc: 'оригинальная тема' },
  ];

  var frame = document.getElementById('frame');
  var stage = document.getElementById('stage');
  var current = null;
  var paused = false;

  var list = document.getElementById('theme-list');
  THEMES.forEach(function (t) {
    var btn = document.createElement('button');
    btn.className = 'theme-btn';
    btn.dataset.id = t.id;
    btn.innerHTML =
      '<img src="/themes/' + t.id + '/icon.svg" alt="">' +
      '<span class="t-name">' + t.name +
      '<span class="t-desc">' + t.desc + '</span></span>';
    btn.addEventListener('click', function () { selectTheme(t.id); });
    list.appendChild(btn);
  });

  function selectTheme(id) {
    current = id;
    Array.prototype.forEach.call(list.children, function (b) {
      b.classList.toggle('active', b.dataset.id === id);
    });
    // Пересоздаём iframe, чтобы демо-лента стартовала заново
    var src = '/themes/' + id + '/index.html?t=' + Date.now();
    frame.src = src;
    frame.onload = function () {
      postToFrame({ cmd: 'rate', value: parseFloat(document.getElementById('rate').value) });
      postToFrame({ cmd: 'pause', value: paused });
    };
  }

  function postToFrame(msg) {
    if (frame.contentWindow) {
      try { frame.contentWindow.postMessage(msg, '*'); } catch (e) {}
    }
  }

  document.getElementById('backdrop').addEventListener('change', function (e) {
    stage.className = 'stage ' + e.target.value;
  });

  var rateInput = document.getElementById('rate');
  rateInput.addEventListener('input', function () {
    document.getElementById('rate-val').textContent = rateInput.value + '×';
    postToFrame({ cmd: 'rate', value: parseFloat(rateInput.value) });
  });

  var pauseBtn = document.getElementById('pause');
  pauseBtn.addEventListener('click', function () {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ Продолжить' : '⏸ Пауза';
    pauseBtn.classList.toggle('active', paused);
    postToFrame({ cmd: 'pause', value: paused });
  });

  document.getElementById('clear').addEventListener('click', function () {
    postToFrame({ cmd: 'clear' });
  });

  document.getElementById('donate').addEventListener('click', function () {
    postToFrame({ cmd: 'trigger', kind: 'donation' });
  });

  document.getElementById('live').addEventListener('click', function () {
    postToFrame({ cmd: 'trigger', kind: 'live' });
  });

  selectTheme('Matrix');
</script>
</body>
</html>
