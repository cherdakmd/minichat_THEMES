name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    name: Валидация тем
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверка манифестов, локалей и скриптов
        run: python3 .github/scripts/validate_themes.py
